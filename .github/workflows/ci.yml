name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://vidportal:vidportal@127.0.0.1:5432/vidportal
      DIRECT_URL: postgresql://vidportal:vidportal@127.0.0.1:5432/vidportal
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      CLOUDFLARE_ACCOUNT_ID: ci-placeholder
      R2_BUCKET_NAME: ci-placeholder
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      CLOUDFLARE_STREAM_API_TOKEN: ci-placeholder
      CLOUDFLARE_STREAM_CUSTOMER_CODE: ci-placeholder
      CLOUDFLARE_STREAM_WEBHOOK_SECRET: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      RESEND_FROM_EMAIL: VidPortal CI <noreply@example.com>

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.mts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Run unit and integration tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Run API end-to-end smoke test
        run: npm run test:e2e -- tests/e2e/health.spec.ts
